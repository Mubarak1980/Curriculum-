<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Revision Dashboard</title>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1> Curriculum</h1>
            <p class="subtitle">Select your grade and subject to review subtopics.</p>
        </header>

        <div class="controls">
            <!-- Ensure option values match your lowercase filenames (grade9.json, grade10.json, etc.) -->
            <select id="gradeSelect">
                <option value="grade9">Grade 9</option>
                <option value="grade10">Grade 10</option>
                <option value="grade11">Grade 11</option>
                <option value="grade12">Grade 12</option>
            </select>

            <select id="subjectSelect">
                <option value="all">All Subjects</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search subtopics...">

            <button id="commonViewBtn" style="padding: 10px 15px; background: var(--primary, #4f46e5); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Common Units & Topics</button>
        </div>

        <div id="content">
            <div class="loading">Loading curriculum data...</div>
        </div>
    </div>

    <script>
        let currentData = null;
        const allGradesData = {};

        const gradeSelect = document.getElementById('gradeSelect');
        const subjectSelect = document.getElementById('subjectSelect');
        const searchInput = document.getElementById('searchInput');
        const contentDiv = document.getElementById('content');
        const commonViewBtn = document.getElementById('commonViewBtn');

        // Automatically load all grade JSON files in the background for cross-analysis
        async function loadAllGrades() {
            const grades = ['grade9', 'grade10', 'grade11', 'grade12'];
            for (const g of grades) {
                try {
                    const res = await fetch(`${g}.json`);
                    if (res.ok) {
                        allGradesData[g] = await res.json();
                    }
                } catch (e) {
                    console.error(`Could not load ${g}.json for common analysis`, e);
                }
            }
        }

        async function loadGradeData(gradeFile) {
            contentDiv.innerHTML = `<div class="loading">Loading data...</div>`;
            try {
                const response = await fetch(`${gradeFile}.json`);
                if (!response.ok) throw new Error(`Could not load ${gradeFile}.json`);
                currentData = await response.json();
                populateSubjectDropdown(currentData.subjects);
                renderCurriculum(currentData.subjects);
            } catch (err) {
                contentDiv.innerHTML = `<div class="error">Error loading data. Make sure ` +
                    `<b>${gradeFile}.json</b> exists in your repository!</div>`;
                console.error(err);
            }
        }

        function populateSubjectDropdown(subjects) {
            const currentSelected = subjectSelect.value;
            subjectSelect.innerHTML = '<option value="all">All Subjects</option>';
            subjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub.name;
                option.textContent = sub.name;
                subjectSelect.appendChild(option);
            });
            subjectSelect.value = subjects.some(s => s.name === currentSelected) ? currentSelected : 'all';
        }

        function renderCurriculum(subjects) {
            const selectedSubject = subjectSelect.value;
            const searchTerm = searchInput.value.toLowerCase();

            let html = '';

            subjects.forEach(subject => {
                if (selectedSubject !== 'all' && subject.name !== selectedSubject) return;

                let subjectHasMatches = false;
                let unitsHtml = '';

                subject.units.forEach(unit => {
                    const filteredSubtopics = unit.subtopics.filter(sub => 
                        sub.toLowerCase().includes(searchTerm) || 
                        unit.title.toLowerCase().includes(searchTerm) ||
                        unit.unit.toLowerCase().includes(searchTerm)
                    );

                    if (filteredSubtopics.length > 0 || searchTerm === '') {
                        subjectHasMatches = true;
                        unitsHtml += `
                            <div class="unit-card">
                                <div class="unit-header">${unit.unit}: ${unit.title}</div>
                                <ul>
                                    ${(searchTerm === '' ? unit.subtopics : filteredSubtopics)
                                        .map(sub => `<li>${sub}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                });

                if (subjectHasMatches) {
                    html += `<h2 style="color: var(--text-main); margin-top: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 5px;">📚 ${subject.name}</h2>`;
                    html += unitsHtml;
                }
            });

            if (html === '') {
                html = `<div class="loading">No matching subtopics found.</div>`;
            }

            contentDiv.innerHTML = html;
        }

        // SMART SEMANTIC CONCEPT CLUSTERS (Maps related academic concepts regardless of spelling nuances)
        const semanticClusters = {
            "Vectors & Direction": ["vector", "scalars", "magnitude", "direction", "displacement"],
            "Cellular & Molecular Biology": ["cell", "dna", "protein", "enzyme", "nucleus", "membrane", "biosphere"],
            "Ecology & Environment": ["ecosystem", "ecology", "environment", "biome", "succession", "biodiversity", "population"],
            "Motion & Kinematics": ["motion", "speed", "velocity", "acceleration", "projectile", "kinematics"],
            "Forces & Dynamics": ["force", "newton", "friction", "momentum", "gravity", "laws of motion"],
            "Chemical Bonding & Structure": ["bond", "ionic", "covalent", "metallic", "atomic", "electron", "periodic"],
            "Equations & Algebra": ["equation", "linear", "quadratic", "simultaneous", "polynomial", "inequality"],
            "Trigonometry & Geometry": ["trigonometry", "triangle", "angle", "polygon", "sine", "cosine", "tangent"]
        };

        function renderSmartAnalysis() {
            contentDiv.innerHTML = `<h2>🧠 Smart Curriculum Conceptual Engine</h2><p class="subtitle">Categorizing same-subject progressions and deep conceptual links across grades.</p>`;
            
            const sameSubjectMap = {}; 
            const crossDisciplineMap = {}; 

            const allUnits = [];
            Object.keys(allGradesData).forEach(gradeKey => {
                const gradeData = allGradesData[gradeKey];
                gradeData.subjects.forEach(subject => {
                    subject.units.forEach(unit => {
                        allUnits.push({
                            grade: gradeData.grade,
                            subject: subject.name,
                            unit: unit.unit,
                            title: unit.title,
                            text: `${unit.title} ${unit.subtopics.join(' ')}`.toLowerCase()
                        });
                    });
                });
            });

            Object.keys(semanticClusters).forEach(clusterName => {
                const keywords = semanticClusters[clusterName];
                
                allUnits.forEach(u => {
                    const matchesKeyword = keywords.some(kw => u.text.includes(kw));
                    if (matchesKeyword) {
                        // Category 1: Same Subject Progressions
                        const subjectKey = `${u.subject} -> ${clusterName}`;
                        if (!sameSubjectMap[subjectKey]) sameSubjectMap[subjectKey] = [];
                        if (!sameSubjectMap[subjectKey].some(item => item.grade === u.grade && item.unit === u.unit)) {
                            sameSubjectMap[subjectKey].push(u);
                        }

                        // Category 2: Cross-Discipline Related Topics
                        if (!crossDisciplineMap[clusterName]) crossDisciplineMap[clusterName] = [];
                        if (!crossDisciplineMap[clusterName].some(item => item.grade === u.grade && item.subject === u.subject && item.unit === u.unit)) {
                            crossDisciplineMap[clusterName].push(u);
                        }
                    }
                });
            });

            // --- RENDER SECTION 1: Same Subject Progressions ---
            let sameSubjectHtml = `<h3 style="margin-top: 20px; color: var(--primary);">📌 1. Common Concepts Within the Same Subject</h3>`;
            let foundSameSubject = false;

            Object.keys(sameSubjectMap).forEach(key => {
                const items = sameSubjectMap[key];
                const uniqueGrades = [...new Set(items.map(i => i.grade))];
                
                if (uniqueGrades.length > 1) {
                    foundSameSubject = true;
                    sameSubjectHtml += `
                        <div class="unit-card">
                            <div class="unit-header">Subject Progression: ${key}</div>
                            <ul>
                                ${items.map(i => `<li>Grade ${i.grade} - Unit ${i.unit}: <b>${i.title}</b></li>`).join('')}
                            </ul>
                        </div>`;
                }
            });
            if (!foundSameSubject) sameSubjectHtml += `<p>No multi-grade progressions found within the same subject yet.</p>`;

            // --- RENDER SECTION 2: Smart Related Cross-Topic Links ---
            let crossHtml = `<h3 style="margin-top: 30px; color: var(--primary);">🔗 2. Smart Related Topics & Conceptual Links</h3>`;
            let foundCross = false;

            Object.keys(crossDisciplineMap).forEach(clusterName => {
                const items = crossDisciplineMap[clusterName];
                const uniqueSubjects = [...new Set(items.map(i => i.subject))];

                if (items.length >= 2) {
                    foundCross = true;
                    crossHtml += `
                        <div class="unit-card">
                            <div class="unit-header">Concept Cluster: "${clusterName}"</div>
                            <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: -5px; margin-bottom: 10px;">
                                Semantically linked across subjects: <b>${uniqueSubjects.join(', ')}</b>
                            </p>
                            <ul>
                                ${items.map(i => `<li>Grade ${i.grade} (${i.subject}) - Unit ${i.unit}: <b>${i.title}</b></li>`).join('')}
                            </ul>
                        </div>`;
                }
            });
            if (!foundCross) crossHtml += `<p>No conceptual links found.</p>`;

            contentDiv.innerHTML += sameSubjectHtml + crossHtml;
        }

        // Event Listeners
        gradeSelect.addEventListener('change', (e) => loadGradeData(e.target.value));
        subjectSelect.addEventListener('change', () => { if (currentData) renderCurriculum(currentData.subjects); });
        searchInput.addEventListener('input', () => { if (currentData) renderCurriculum(currentData.subjects); });
        
        commonViewBtn.addEventListener('click', () => {
            renderSmartAnalysis();
        });

        // Initial load on page start
        loadAllGrades();
        loadGradeData(gradeSelect.value);

        // Register Service Worker for PWA Offline Installability
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('ServiceWorker registered successfully!', reg))
                    .catch(err => console.log('ServiceWorker registration failed:', err));
            });
        }
    </script>
</body>
</html>
