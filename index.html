<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Revision Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Ethiopian Curriculum Explorer</h1>
            <p class="subtitle">Select your grade and subject to review subtopics.</p>
        </header>

        <div class="controls">
            <!-- Ensure option values match your lowercase filenames (grade9.json, grade10.json, etc.) -->
            <select id="gradeSelect">
                <option value="grade9">Grade 9</option>
                <option value="grade10">Grade 10</option>
                <option value="grade11">Grade 11</option>
                <option value="grade12">Grade 12</option>
            </select>

            <select id="subjectSelect">
                <option value="all">All Subjects</option>
            </select>

            <input type="text" id="searchInput" placeholder="Search subtopics...">

            <button id="commonViewBtn" style="padding: 10px 15px; background: var(--primary, #4f46e5); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Common Units & Topics</button>
        </div>

        <div id="content">
            <div class="loading">Loading curriculum data...</div>
        </div>
    </div>

    <script>
        let currentData = null;
        const allGradesData = {};

        const gradeSelect = document.getElementById('gradeSelect');
        const subjectSelect = document.getElementById('subjectSelect');
        const searchInput = document.getElementById('searchInput');
        const contentDiv = document.getElementById('content');
        const commonViewBtn = document.getElementById('commonViewBtn');

        // Automatically load all grade JSON files in the background for cross-analysis
        async function loadAllGrades() {
            const grades = ['grade9', 'grade10', 'grade11', 'grade12'];
            for (const g of grades) {
                try {
                    const res = await fetch(`${g}.json`);
                    if (res.ok) {
                        allGradesData[g] = await res.json();
                    }
                } catch (e) {
                    console.error(`Could not load ${g}.json for common analysis`, e);
                }
            }
        }

        async function loadGradeData(gradeFile) {
            contentDiv.innerHTML = `<div class="loading">Loading data...</div>`;
            try {
                const response = await fetch(`${gradeFile}.json`);
                if (!response.ok) throw new Error(`Could not load ${gradeFile}.json`);
                currentData = await response.json();
                populateSubjectDropdown(currentData.subjects);
                renderCurriculum(currentData.subjects);
            } catch (err) {
                contentDiv.innerHTML = `<div class="error">Error loading data. Make sure ` +
                    `<b>${gradeFile}.json</b> exists in your repository!</div>`;
                console.error(err);
            }
        }

        function populateSubjectDropdown(subjects) {
            const currentSelected = subjectSelect.value;
            subjectSelect.innerHTML = '<option value="all">All Subjects</option>';
            subjects.forEach(sub => {
                const option = document.createElement('option');
                option.value = sub.name;
                option.textContent = sub.name;
                subjectSelect.appendChild(option);
            });
            subjectSelect.value = subjects.some(s => s.name === currentSelected) ? currentSelected : 'all';
        }

        function renderCurriculum(subjects) {
            const selectedSubject = subjectSelect.value;
            const searchTerm = searchInput.value.toLowerCase();

            let html = '';

            subjects.forEach(subject => {
                if (selectedSubject !== 'all' && subject.name !== selectedSubject) return;

                let subjectHasMatches = false;
                let unitsHtml = '';

                subject.units.forEach(unit => {
                    const filteredSubtopics = unit.subtopics.filter(sub => 
                        sub.toLowerCase().includes(searchTerm) || 
                        unit.title.toLowerCase().includes(searchTerm) ||
                        unit.unit.toLowerCase().includes(searchTerm)
                    );

                    if (filteredSubtopics.length > 0 || searchTerm === '') {
                        subjectHasMatches = true;
                        unitsHtml += `
                            <div class="unit-card">
                                <div class="unit-header">${unit.unit}: ${unit.title}</div>
                                <ul>
                                    ${(searchTerm === '' ? unit.subtopics : filteredSubtopics)
                                        .map(sub => `<li>${sub}</li>`).join('')}
                                </ul>
                            </div>
                        `;
                    }
                });

                if (subjectHasMatches) {
                    html += `<h2 style="color: var(--text-main); margin-top: 30px; border-bottom: 2px solid var(--primary); padding-bottom: 5px;">📚 ${subject.name}</h2>`;
                    html += unitsHtml;
                }
            });

            if (html === '') {
                html = `<div class="loading">No matching subtopics found.</div>`;
            }

            contentDiv.innerHTML = html;
        }

        function renderCommonAnalysis() {
            contentDiv.innerHTML = `<h2>🔍 Cross-Grade Common Units & Topics</h2><p class="subtitle">Comparing overlaps across your grade files.</p>`;
            
            const unitMap = {};
            const topicMap = {};

            Object.keys(allGradesData).forEach(gradeKey => {
                const gradeData = allGradesData[gradeKey];
                const gradeNum = gradeData.grade;

                gradeData.subjects.forEach(subject => {
                    subject.units.forEach(unit => {
                        // Track Units by Title
                        const cleanUnitTitle = unit.title.toLowerCase().trim();
                        if (!unitMap[cleanUnitTitle]) unitMap[cleanUnitTitle] = { title: unit.title, occurrences: [] };
                        unitMap[cleanUnitTitle].occurrences.push({ grade: gradeNum, subject: subject.name, unit: unit.unit });

                        // Track Subtopics
                        unit.subtopics.forEach(sub => {
                            const cleanSub = sub.toLowerCase().trim();
                            if (!topicMap[cleanSub]) topicMap[cleanSub] = { title: sub, occurrences: [] };
                            topicMap[cleanSub].occurrences.push({ grade: gradeNum, subject: subject.name, unit: `${unit.unit} (${unit.title})` });
                        });
                    });
                });
            });

            // Render Common Units
            let unitsHtml = `<h3 style="margin-top: 20px; color: var(--primary);">📌 Common Units Across Grades</h3>`;
            let foundUnits = false;
            Object.values(unitMap).forEach(item => {
                if (item.occurrences.length > 1) {
                    foundUnits = true;
                    unitsHtml += `
                        <div class="unit-card">
                            <div class="unit-header">${item.title}</div>
                            <ul>
                                ${item.occurrences.map(occ => `<li>Grade ${occ.grade} - <b>${occ.subject}</b> (${occ.unit})</li>`).join('')}
                            </ul>
                        </div>`;
                }
            });
            if (!foundUnits) unitsHtml += `<p>No duplicate unit titles found across different grades yet.</p>`;

            // Render Common Topics
            let topicsHtml = `<h3 style="margin-top: 30px; color: var(--primary);">🔗 Common Topics Across Grades</h3>`;
            let foundTopics = false;
            Object.values(topicMap).forEach(item => {
                if (item.occurrences.length > 1) {
                    foundTopics = true;
                    topicsHtml += `
                        <div class="unit-card">
                            <div class="unit-header">${item.title}</div>
                            <ul>
                                ${item.occurrences.map(occ => `<li>Grade ${occ.grade} - <b>${occ.subject}</b> in ${occ.unit}</li>`).join('')}
                            </ul>
                        </div>`;
                }
            });
            if (!foundTopics) topicsHtml += `<p>No duplicate subtopics found across different grades yet.</p>`;

            contentDiv.innerHTML += unitsHtml + topicsHtml;
        }

        // Event Listeners
        gradeSelect.addEventListener('change', (e) => {
            loadGradeData(e.target.value);
        });

        subjectSelect.addEventListener('change', () => {
            if (currentData) renderCurriculum(currentData.subjects);
        });

        searchInput.addEventListener('input', () => {
            if (currentData) renderCurriculum(currentData.subjects);
        });

        commonViewBtn.addEventListener('click', () => {
            renderCommonAnalysis();
        });

        // Initial load on page start
        loadAllGrades();
        loadGradeData(gradeSelect.value);
    </script>
</body>
</html>
